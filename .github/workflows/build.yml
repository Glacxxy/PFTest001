name: Build Player Finder

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build .levipack
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: PlayerFinder-levipack-arm64
          path: build-arm64-v8a/*.levipack
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64-v8a/*.levipack
